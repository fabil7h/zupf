<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>zupf</title>
    <link rel="stylesheet" href="./docs.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='12' width='24' height='18' rx='5' fill='%2318181b'/><rect x='12' y='15' width='8' height='2' rx='1' fill='%23a1a1aa'/></svg>"
    />
    <script>
      // Apply the stored theme before first paint.
      const t = localStorage.getItem('zupf-theme');
      if (t) document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
